# Disposable integration databases. Never use production credentials or volumes here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notideck_test
      POSTGRES_USER: notideck
      POSTGRES_PASSWORD: integration-test-only
    ports: ['127.0.0.1:15432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notideck -d notideck_test']
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notideck_test
      MYSQL_ROOT_PASSWORD: integration-test-only
    ports: ['127.0.0.1:13306:3306']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -pintegration-test-only']
      interval: 2s
      timeout: 3s
      retries: 60
