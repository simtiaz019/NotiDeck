name: CI
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          - {python: '3.12', os: windows-latest}
          - {python: '3.12', os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated Python environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv
          directory = Path(os.environ["RUNNER_TEMP"]) / "notideck-ci-venv"
          venv.EnvBuilder(with_pip=True).create(directory)
          scripts = directory / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(scripts) + "\n")
      - run: python -m pip install --upgrade 'pip>=26.2.2' 'setuptools>=84.1.0'
      - run: python -m pip install -e '.[dev]' twine pip-audit
      - run: pip-audit
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend audit --audit-level=high
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: ruff check src tests
      - run: mypy src/notideck
      - run: pytest --cov=notideck
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/wheel_smoke.py
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notideck
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: notideck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U notideck -d notideck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: notideck_test
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest-only-password"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,postgres,mysql]'
      - run: pytest tests/test_database.py tests/test_external_queue.py
        env:
          NOTIDECK_TEST_DATABASE_URL: postgresql+psycopg://notideck:test-only-password@localhost:5432/notideck_test
      - run: pytest tests/test_database.py tests/test_external_queue.py
        env:
          NOTIDECK_TEST_DATABASE_URL: mysql+pymysql://root:test-only-password@localhost:3306/notideck_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend audit --audit-level=high
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t notideck:rc-test .
      - run: python tests/docker_smoke.py
